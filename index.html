<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152c48"><title>Sunny 電子商務導論｜互動複習題庫</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#1b2c46;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #88c8fb;outline-offset:2px}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#142b48,#275b79);color:white;padding:32px;border-radius:24px;margin-bottom:24px;box-shadow:0 16px 35px #23436320}.eyebrow{font-size:12px;letter-spacing:.17em;color:#b8d8ec}.hero h1{font-size:clamp(25px,4vw,40px);margin:12px 0 10px}.hero p{opacity:.83;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.stat,.panel,.question-card{background:white;border:1px solid #e1e8f0;border-radius:18px;box-shadow:0 4px 15px #1a355809}.stat{padding:16px}.stat strong{display:block;font-size:27px;color:#193e62}.stat small{color:#6b7b8c}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:17px}.tabs button,.btn{border:1px solid #d9e4ed;border-radius:11px;background:white;color:#26425a;padding:10px 15px;font-weight:650}.tabs button.active,.btn.primary{background:#173e5e;color:white;border-color:#173e5e}.btn:disabled{opacity:.45;cursor:not-allowed}.panel{padding:22px;margin-bottom:16px}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:175px}.field label{font-size:12px;color:#64748b;font-weight:700}select,input,textarea{width:100%;padding:12px;border:1px solid #dce5ed;border-radius:10px;background:white;color:#20344b}.question-card{padding:26px;margin-top:16px}.question-card h2{font-size:20px;line-height:1.65;margin:8px 0 22px}.question-card h3{margin:0;font-size:19px;line-height:1.6}.muted{color:#6b7e91;font-size:13px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid #dbe5ed;border-radius:12px;background:#fff;padding:15px;color:#253a4e;line-height:1.65;width:100%}.choice .letter{flex-shrink:0;border-radius:8px;background:#eaf0f6;padding:0 7px;font-weight:750}.choice.selected{border-color:#3b82b1;background:#eef8ff}.choice.correct{border-color:#2b9c79;background:#eafaf2}.choice.wrong{border-color:#da6a6a;background:#fff1f0}.choice:disabled{cursor:default}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:19px}.feedback{padding:14px;border-radius:10px;margin-top:15px;background:#ecf8f2;border-left:4px solid #21a078}.feedback.bad{background:#fff5ed;border-color:#ed9a43}.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 9px;background:#e7eff7;border-radius:99px;color:#245070}.progress{background:#e8eef4;height:9px;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#5ba3c9,#45b58e);transition:width .2s}.list{display:grid;gap:12px}.listitem{border:1px solid #e0e8f0;border-radius:13px;padding:16px;background:#fff}.listitem p{line-height:1.8}.answer{margin-top:12px;padding:15px;background:#eef8f6;border-radius:12px;line-height:1.8}.tiny{font-size:12px;color:#78899a}textarea{min-height:105px;resize:vertical}.empty{text-align:center;padding:50px 20px;color:#627387}.footer{padding:22px 0;text-align:center;color:#8795a6;font-size:12px}.right{margin-left:auto}.notice{background:#fff8e9;border:1px solid #f2dfaa;padding:13px 15px;border-radius:12px;color:#775728;font-size:13px;line-height:1.7}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{font-size:36px;font-weight:800;color:#175e75}@media(max-width:650px){.wrap{padding:13px}.hero{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.panel,.question-card{padding:16px}.grid2{grid-template-columns:1fr}.question-card h2{font-size:17px}.tabs button{flex:1;padding:10px 7px;font-size:13px}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SUNNY · STUDY STUDIO</div><h1>電子商務導論｜複習題庫</h1><p>按章練習・模擬考・錯題重練・簡答背誦｜資料僅保存在這個瀏覽器</p></header><section class="stats"><div class="stat"><strong id="total">92</strong><small>選擇題</small></div><div class="stat"><strong id="shortTotal">20</strong><small>簡答題</small></div><div class="stat"><strong id="completed">0</strong><small>已作答題數</small></div><div class="stat"><strong id="accuracy">—</strong><small>累積正確率</small></div></section><nav class="tabs" id="tabs"><button data-tab="home" class="active">首頁</button><button data-tab="practice">章節練習</button><button data-tab="exam">模擬測驗</button><button data-tab="short">簡答／填充</button><button data-tab="wrong">錯題本</button></nav><section id="screen"></section><footer class="footer">Sunny 電子商務導論 · 題庫依課程測驗截圖與第一次作業整理 · 標準答案以原教材為準</footer></main><script src="questions.js"></script><script>
'use strict';
const $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='sunny_ecommerce_study_v1';let saved={records:{},wrong:[],favs:[],shortNotes:{}};try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&typeof p==='object')saved={...saved,...p}}catch(e){};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
let tab='home',session=null,filterChapter='all',shortChapter='all',shortQuery='',revealShort=new Set();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function stats(){const r=Object.values(saved.records),correct=r.filter(x=>x.correct).length;$('#total').textContent=bank.length;$('#shortTotal').textContent=shortBank.length;$('#completed').textContent=r.length;$('#accuracy').textContent=r.length?Math.round(100*correct/r.length)+'%':'—'}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
function htmlOpts(items,chosen){return items.map(([v,s])=>`<option value="${escapeHtml(v)}" ${v===chosen?'selected':''}>${escapeHtml(s)}</option>`).join('')}
const chapOpts=[['all','全部章節'],...chapters.map((s,i)=>[String(i),`第${i+1}單元｜${s}`])];
function render(){stats();if(tab==='home')home();if(tab==='practice')practiceStart();if(tab==='exam')examStart();if(tab==='short')shortView();if(tab==='wrong')wrongView()}
function home(){const counts=chapters.map((ch,i)=>bank.filter(q=>q.chapter===i).length);$('#screen').innerHTML=`<div class="panel"><h2>準備開始複習了嗎？</h2><p>選擇題共 ${bank.length} 題，按 6 個單元整理；另有 ${shortBank.length} 題簡答題。作答後立即顯示教材標準答案，錯題會自動加入錯題本。</p><div class="grid2">${chapters.map((ch,i)=>`<button class="listitem" style="text-align:left;cursor:pointer" data-start-ch="${i}"><span class="pill">第${i+1}單元 · ${counts[i]}題</span><h3>${escapeHtml(ch)}</h3><span class="muted">點此開始練習 →</span></button>`).join('')}</div></div><div class="notice">提醒：題目依原始截圖與作業整理，部分長選項為便於閱讀進行語句精簡；原教材中少數歷史統計、金額或法規描述可能已過時。模擬考判分仍依圖片右側標準答案。第5單元第10題原題「每天」與「月營業額」及選項存在疑義，保留原標準答案B。</div>`;document.querySelectorAll('[data-start-ch]').forEach(b=>b.onclick=()=>{filterChapter=b.dataset.startCh;setTab('practice');startSession('practice')})}
function practiceStart(){if(session?.mode==='practice'&&!session.done){showQuestion();return}$('#screen').innerHTML=`<div class="panel"><h2>章節練習</h2><p class="muted">挑選單元、按原本順序或隨機出題，每題作答後可查看標準答案。</p><div class="filters"><div class="field"><label>練習範圍</label><select id="chapter">${htmlOpts(chapOpts,filterChapter)}</select></div><div class="field"><label>題目順序</label><select id="order"><option value="normal">依序練習</option><option value="random">隨機練習</option></select></div><button class="btn primary" id="start">開始練習</button></div></div>`;$('#chapter').onchange=e=>filterChapter=e.target.value;$('#start').onclick=()=>startSession('practice')}
function examStart(){if(session?.mode==='exam'&&!session.done){showQuestion();return}$('#screen').innerHTML=`<div class="panel"><h2>模擬測驗</h2><p>考題隨機抽選，全部完成才顯示成績和錯題解析。</p><div class="filters"><div class="field"><label>出題單元</label><select id="chapter">${htmlOpts(chapOpts,filterChapter)}</select></div><div class="field"><label>測驗題數</label><select id="count">${htmlOpts([['10','10 題'],['20','20 題'],['30','30 題'],['all','該單元全部題目']],'20')}</select></div><button class="btn primary" id="start">開始模擬考</button></div></div>`;$('#chapter').onchange=e=>filterChapter=e.target.value;$('#start').onclick=()=>startSession('exam')}
function startSession(mode,ids){let qs=ids?bank.filter(q=>ids.includes(q.id)):bank.filter(q=>filterChapter==='all'||q.chapter===Number(filterChapter));if(mode==='exam'||$('#order')?.value==='random')qs=shuffle(qs);if(mode==='exam'&&!ids){const v=$('#count')?.value||'20';if(v!=='all')qs=qs.slice(0,Number(v))}session={mode,questions:qs,index:0,answers:{},done:false,selected:null,checked:false};setTab(mode==='wrong'?'wrong':mode);showQuestion()}
function showQuestion(){if(!session||session.done)return;const q=session.questions[session.index];if(!q){finishSession();return}const selected=session.answers[q.id];const checked=session.checked;let output=`<div class="panel"><span class="pill">${escapeHtml(chapters[q.chapter])}</span><span class="muted right" style="float:right">第 ${session.index+1} / ${session.questions.length} 題</span><div class="progress"><span style="width:${(session.index/session.questions.length)*100}%"></span></div><div class="muted">${session.mode==='exam'?'模擬測驗 · 作答後按下一題，結束才顯示答案':'章節練習 · 作答後即時查看正確答案'}</div></div><article class="question-card"><h2>${escapeHtml(q.question)}</h2><div class="choices">${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${checked&&i===q.answer?'correct':''} ${checked&&i===selected&&i!==q.answer?'wrong':''}" data-choice="${i}" ${checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>`;
if(checked){const ok=selected===q.answer;output+=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ 答對了！':'再複習一次'}</strong><div>標準答案：${'ABCD'[q.answer]}．${escapeHtml(q.options[q.answer])}</div></div>`}output+=`<div class="actions">${!checked?`<button class="btn primary" id="confirm" ${selected===undefined?'disabled':''}>${session.mode==='exam'?'確認並前往下一題':'確認答案'}</button>`:`<button class="btn primary" id="next">${session.index===session.questions.length-1?'查看結果':'下一題 →'}</button>`}<button class="btn" id="fav">${saved.favs.includes(q.id)?'★ 已收藏':'☆ 收藏題目'}</button><button class="btn right" id="quit">結束練習</button></div></article>`;$('#screen').innerHTML=output;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{session.answers[q.id]=Number(b.dataset.choice);showQuestion()});$('#confirm')?.addEventListener('click',()=>{let choice=session.answers[q.id];if(choice===undefined)return;const ok=choice===q.answer;saved.records[q.id]={correct:ok,choice,at:Date.now()};saved.wrong=ok?saved.wrong.filter(id=>id!==q.id):[...new Set([...saved.wrong,q.id])];save();stats();if(session.mode==='exam'){session.index++;if(session.index>=session.questions.length)finishSession();else showQuestion()}else{session.checked=true;showQuestion()}});$('#next')?.addEventListener('click',()=>{session.index++;session.checked=false;if(session.index>=session.questions.length)finishSession();else showQuestion()});$('#fav').onclick=()=>{saved.favs=saved.favs.includes(q.id)?saved.favs.filter(x=>x!==q.id):[...saved.favs,q.id];save();showQuestion()};$('#quit').onclick=()=>{session=null;render()}}
function finishSession(){session.done=true;const result=session.questions.filter(q=>saved.records[q.id]?.choice===q.answer).length;const missed=session.questions.filter(q=>saved.records[q.id]?.choice!==q.answer);$('#screen').innerHTML=`<div class="panel"><span class="pill">完成測驗</span><h2>本次練習結果</h2><div class="result">${result} / ${session.questions.length}</div><p>答對 ${result} 題，答錯 ${missed.length} 題，正確率 ${Math.round(100*result/session.questions.length)||0}%</p><div class="actions"><button class="btn primary" id="restart">再練習一次</button><button class="btn" id="end">返回首頁</button></div></div>${missed.length?`<div class="panel"><h3>本次錯題</h3>${missed.map(q=>`<div class="listitem" style="margin:9px 0"><strong>${escapeHtml(q.question)}</strong><p>標準答案：${'ABCD'[q.answer]}．${escapeHtml(q.options[q.answer])}</p></div>`).join('')}</div>`:''}`;$('#restart').onclick=()=>{const m=session.mode;session=null;startSession(m==='exam'?'exam':'practice')};$('#end').onclick=()=>{session=null;setTab('home')};stats()}
function wrongView(){if(session?.mode==='practice'&&!session.done){showQuestion();return}const q=bank.filter(q=>saved.wrong.includes(q.id));$('#screen').innerHTML=`<div class="panel"><h2>錯題本 <span class="pill">${q.length} 題</span></h2><p class="muted">答錯會自動加入，重新答對即移除。資料保存在目前瀏覽器。</p><div class="actions"><button class="btn primary" id="retry" ${q.length?'':'disabled'}>重練全部錯題</button><button class="btn" id="reset" ${q.length?'':'disabled'}>清空錯題本</button></div></div><div class="list">${q.map(x=>`<div class="listitem"><span class="pill">${escapeHtml(chapters[x.chapter])}</span><p><strong>${escapeHtml(x.question)}</strong></p><p>標準答案：${'ABCD'[x.answer]}．${escapeHtml(x.options[x.answer])}</p></div>`).join('')||'<div class="empty">目前沒有錯題，繼續保持！</div>'}</div>`;$('#retry').onclick=()=>{session=null;startSession('practice',q.map(x=>x.id))};$('#reset').onclick=()=>{if(confirm('確定要清空錯題本嗎？')){saved.wrong=[];save();render()}}}
function shortView(){const qs=shortBank.filter(x=>(shortChapter==='all'||x.chapter===Number(shortChapter))&&(!shortQuery||[x.question,x.answer,x.keywords].some(s=>s.toLowerCase().includes(shortQuery.toLowerCase()))));$('#screen').innerHTML=`<div class="panel"><h2>簡答／填充題練習</h2><p class="muted">共20題，依第一次作業的5大主題拆解。先在心裡回答或輸入筆記，再點「顯示答案」核對必背關鍵字。這區不會使用文字完全相同比對判分。</p><div class="filters"><div class="field"><label>主題篩選</label><select id="shortChapter">${htmlOpts([['all','全部主題'],...chapters.slice(0,5).map((s,i)=>[String(i),s])],shortChapter)}</select></div><div class="field"><label>搜尋題目</label><input id="search" placeholder="例如 B2B、支付寶、接觸" value="${escapeHtml(shortQuery)}"></div><button class="btn" id="revealAll">全部顯示答案</button><button class="btn" id="hideAll">全部隱藏</button></div></div><div class="list">${qs.map((q,i)=>`<article class="listitem"><span class="pill">${escapeHtml(chapters[q.chapter])}</span><h3>${escapeHtml(q.question)}</h3><textarea data-note="${q.id}" placeholder="先寫下你記得的重點（僅儲存在瀏覽器）">${escapeHtml(saved.shortNotes[q.id]||'')}</textarea><div class="actions"><button class="btn" data-reveal="${q.id}">${revealShort.has(q.id)?'隱藏答案':'顯示答案'}</button></div>${revealShort.has(q.id)?`<div class="answer"><strong>參考答案：</strong>${escapeHtml(q.answer)}<div class="tiny"><strong>必背：</strong>${escapeHtml(q.keywords)}</div></div>`:''}</article>`).join('')||'<div class="empty">找不到符合條件的題目</div>'}</div>`;$('#shortChapter').onchange=e=>{shortChapter=e.target.value;shortView()};$('#search').oninput=e=>{shortQuery=e.target.value;shortView();$('#search').focus()};$('#revealAll').onclick=()=>{qs.forEach(q=>revealShort.add(q.id));shortView()};$('#hideAll').onclick=()=>{revealShort.clear();shortView()};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const id=b.dataset.reveal;revealShort.has(id)?revealShort.delete(id):revealShort.add(id);shortView()});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{saved.shortNotes[t.dataset.note]=t.value;save()})}
render();
</script></body></html>
